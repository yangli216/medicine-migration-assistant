[package]
name = "medicine-migration-assistant"
version = "0.1.1"
description = "轻量级药品数据迁移助手"
authors = ["RBMH"]
edition = "2021"

[lib]
name = "medicine_migration_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "medicine-migration-assistant"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bson = "3.1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
sqlx-core = { version = "0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-native-roots", "chrono", "rust_decimal"] }
sqlx-mysql = { version = "0.8.6", default-features = false, features = ["chrono", "rust_decimal"] }
rust_decimal = "1"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10.6"
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "json", "native-tls", "query"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
odbc-api = { version = "29.0.0", default-features = false, features = ["odbc_version_3_80"] }

[target.'cfg(not(windows))'.dependencies]
odbc-api = { version = "29.0.0", default-features = false, features = ["odbc_version_3_80", "vendored-unix-odbc"] }

[dev-dependencies]
tempfile = "3"

# spin 0.9.8 is required transitively by the MySQL RSA handshake but is yanked
# from fresh resolution. Vendoring keeps desktop builds deterministic/offline.
[patch.crates-io]
spin = { path = "vendor/spin" }
